<div class="card bg-dark text-white rounded-3 shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <p class="fs-4 mb-0">“{{ feedback.message }}”</p>
      <div>
        <ng-container *ngFor="let star of [].constructor(feedback.rating)">
          <span class="text-warning">★</span>
        </ng-container>
      </div>
    </div>
    <div class="d-flex align-items-center mt-3">
      <img [src]="feedback.image" alt="{{ feedback.author }}" class="rounded-circle me-3" width="40" height="40">
      <div>
        <p class="mb-0">{{ feedback.author }}</p>
        <p class="mb-0"> {{ feedback.details }}</p>
      </div>
    </div>
  </div>
</div>
