<section class="container py-4">
  <h1 class="display-4 fw-bold mb-4" style="font-size: clamp(1.75rem, 4vw, 2.5rem);">Os melhores passeios de Pipa</h1>
  <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
    <div *ngFor="let tour of tours" class="col">
      <div class="card h-100 p-3 d-flex flex-column">
        <img [src]="tour.image" class="card-img-top mb-3" [alt]="tour.title" />
        <div class="d-flex flex-column flex-grow-1">
          <div class="flex-grow-1">
            <p class="card-title mb-4">{{ tour.title }}</p>
            <p class="card-text mb-4">{{ tour.description }}</p>
          </div>
          <button class="btn w-100 mt-auto d-flex justify-content-center align-items-center">
            <p routerLink="/passeios" class="text-center mb-0">{{ tour.buttonText }}</p>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
