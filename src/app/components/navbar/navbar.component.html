<nav class="top-bar">
  <div class="container-fluid px-4 py-2">
    <div class="d-flex align-items-center justify-content-between">
      <!-- 1. Boa prática: trocado href="/" por routerLink="/" -->
      <a routerLink="/">
        <img src="../../../assets/logo-pipa.png" alt="Visão de Pipa" class="logo">
      </a>

      <button class="navbar-toggler d-lg-none border-0" type="button" (click)="toggleMenu()">
        <i class="fa-solid fa-bars text-white"></i>
      </button>

      <ul class="menu d-none d-lg-flex align-items-center gap-4" [class.show]="isMenuOpen">
        <!-- 2. A lógica principal acontece aqui -->
        <li class="dropdown">

          <!-- SE ESTIVER NA PÁGINA /passeios, MOSTRA O LINK "INÍCIO" -->
          <a *ngIf="isOnPasseiosPage" 
             routerLink="/" 
             class="d-flex align-items-center gap-2 text-decoration-none">
            INÍCIO
          </a>

          <!-- SENÃO, MOSTRA O MENU NORMAL DE PASSEIOS -->
          <a *ngIf="!isOnPasseiosPage" 
             class="d-flex align-items-center gap-2 text-decoration-none" >
            TODOS OS PASSEIOS E ROTAS
            <i class="fa-solid fa-chevron-down text-decoration-none"></i>
          </a>
          
          <!-- O menu dropdown só será relevante quando o link de passeios estiver visível -->
          <ul *ngIf="!isOnPasseiosPage" class="dropdown-menu">
            <li><a routerLink="/passeios" class="dropdown-item">Passeio de Jeep</a></li>
            <li><a routerLink="/passeios" class="dropdown-item">Passeio de Buggy</a></li>
            <li><a routerLink="/passeios" class="dropdown-item">Passeio de Quadriciclo</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
